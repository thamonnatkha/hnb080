<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | honey bee</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">honey bee</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <h1>สั่งซื้อสินค้า</h1>
          <hr class="rule">
          <p class="lead">กรอกข้อมูลของคุณ เราจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อ</p>
        </div>

        <form id="orderForm" class="form">
          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" required autocomplete="name">
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" required autocomplete="tel">
          </div>

          <div class="field">
            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" required>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="text" id="total" name="total" required inputmode="numeric">
          </div>

          <div class="field">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note"></textarea>
          </div>

          <button type="submit" class="btn btn-gold">ยืนยันสั่งซื้อ</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="brand">honey bee</span>
      <p>เติมความหวานบริสุทธิ์จากธรรมชาติ</p>
      <small>&copy; honey bee</small>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
